<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roski DLX Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Lucida Console&family=Glegoo&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #150A2E;
    --bg-deep: #0B0620;
    --panel: #1B0F38;
    --panel-border: #3A2266;
    --ink: #EFE9FF;
    --ink-dim: #A895D6;
    --acid: #B6FF2E;
    --acid-dim: #5C7A24;
    --violet: #8A5CF6;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);

    color:var(--ink);
    font-family:'Lucida Console', courier;
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px;
    overflow-x:hidden;
  }

  /* ---------- static hyperbolic 3D wireframe background ---------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
/* Base dark indigo night */
  background-color: #0a0818;
  background-image:
    /* Star layer 3 — larger, brighter stars (foreground) */
    radial-gradient(2px 2px at 20px 30px, #e8ff9e, transparent),
    radial-gradient(2px 2px at 40px 70px, #ffffff, transparent),
    radial-gradient(2px 2px at 90px 40px, #b8b0e8, transparent),
    radial-gradient(2px 2px at 130px 80px, #e8ff9e, transparent),
    radial-gradient(2px 2px at 160px 120px, #ffffff, transparent),
    /* Star layer 2 — medium stars */
    radial-gradient(1px 1px at 50px 160px, #ffffff, transparent),
    radial-gradient(1px 1px at 100px 200px, #e8ff9e, transparent),
    radial-gradient(1px 1px at 150px 50px, #b8b0e8, transparent),
    radial-gradient(1px 1px at 200px 100px, #ffffff, transparent),
    radial-gradient(1px 1px at 250px 180px, #e8ff9e, transparent),
    /* Star layer 1 — tiny distant stars */
    radial-gradient(1px 1px at 10px 90px, #a8a0d8, transparent),
    radial-gradient(1px 1px at 80px 10px, #a8a0d8, transparent),
    radial-gradient(1px 1px at 120px 150px, #a8a0d8, transparent),
    radial-gradient(1px 1px at 180px 20px, #a8a0d8, transparent),
    radial-gradient(1px 1px at 220px 220px, #a8a0d8, transparent),
    /* Indigo night depth gradient */
    radial-gradient(ellipse at 50% 0%, #1a1440 0%, #0d0a1e 45%, #06040f 100%);
  background-size:
    200px 200px, 200px 200px, 200px 200px, 200px 200px, 200px 200px,
    250px 250px, 250px 250px, 250px 250px, 250px 250px, 250px 250px,
    300px 300px, 300px 300px, 300px 300px, 300px 300px, 300px 300px,
    100% 100%;
  background-repeat: repeat, repeat, repeat, repeat, repeat,
                     repeat, repeat, repeat, repeat, repeat,
                     repeat, repeat, repeat, repeat, repeat,
                     no-repeat;
  background-attachment: fixed;
  background-color: #06040f;
    
    overflow:hidden;
  }
  .bg svg{
    position:absolute;
    top:50%; left:50%;
    width:min(1100px, 150vw);
    height:auto;
    transform: translate(-50%, -50%);
  }
  .bg .lattice line{
    stroke: var(--violet);
    stroke-width:1;
    opacity:0.4;
  }
  .bg .lattice .ring{
    fill:none;
    stroke: var(--ink);
    stroke-width:0.75;
    opacity:0.16;
  }
  .bg .lattice .rim{
    fill:none;
    stroke: var(--acid);
    stroke-width:1.5;
    opacity:0.55;
  }
  .bg .scanlines{
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
    opacity:0.45;
  }

  /* ---------- content ---------- */
  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
  }

  header{
    text-align:center;
    margin-bottom:44px;
  }
  .mark{
    width:46px; height:46px;
    margin:0 auto 20px;
  }
  h1{
    font-family:'Glegoo', courier;
    font-weight:400;
    font-size:clamp(1rem, 3.6vw, 1.5rem);
    line-height:1.6;
    letter-spacing:0.02em;
    margin:0;
    color:var(--ink);
    text-shadow: 3px 3px 0 var(--violet);
  }
  h1 span{
    color:var(--acid);
    text-shadow: 3px 3px 0 var(--acid-dim);
  }
  header p{
    color:var(--ink-dim);
    font-family:'Lucida Console', courier;
    font-size:1.1rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin:20px 0 0;
  }
  header .rule{
    width:140px;
    height:4px;
    margin:22px auto 0;
    background: repeating-linear-gradient(90deg, var(--acid) 0 8px, transparent 8px 14px);
  }

  .links{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }

  .link-slot{
    position:relative;
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 20px;
    background:var(--panel);
    border:2px solid var(--panel-border);
    text-decoration:none;
    color:var(--ink);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    transition: border-color 0.15s steps(2), box-shadow 0.15s steps(2), transform 0.1s steps(2);
  }
  .link-slot:hover{
    border-color: var(--acid);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35), 0 0 0 2px rgba(182,255,46,0.25);
    transform: translate(-2px, -2px);
  }
  .link-slot .glyph{
    width:38px; height:38px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Press Start 2P', courier;
    font-size:0.6rem;
    color:var(--acid);
    border:2px solid var(--acid-dim);
    background: rgba(182,255,46,0.06);
  }
  .link-slot:hover .glyph{ border-color: var(--acid); }
  .link-slot .text{ flex:1; min-width:0; }
  .link-slot .label{
    font-family:'Lucida Console', courier;
    font-size:1.25rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    line-height:1.1;
  }
  .link-slot .url{
    font-size:1rem;
    color:var(--ink-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:block;
    font-family:'Lucida Console', courier;
  }
  .link-slot .go{
    color:var(--acid);
    font-family:'Press Start 2P', courier;
    font-size:0.75rem;
    flex:0 0 auto;
  }

  footer{
    text-align:center;
    margin-top:34px;
    color:var(--ink-dim);
    font-size:0.95rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    font-family:'Lucida Console', courier;
  }
</style>
</head>
